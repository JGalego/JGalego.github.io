# Projects shown on /projects.
#
# The page orders them by GitHub stars (most first), then by most recent push.
# Both are fetched from the GitHub API at build time (_plugins/project_stats.rb),
# so the order refreshes on every deploy. If the API can't be reached, the
# order in this file is used as is.
#
# repo:  GitHub repository (owner/name) the stars and last push are read from
# image: file in assets/images/projects/ (640x400 WebP screenshot of the landing page)

