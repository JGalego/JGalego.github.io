title: João Galego
author: João Galego
tagline: Agents of change
description: >-
  João Galego leads AI at Critical Software, bringing ML to high-stakes domains.
  He makes things, breaks things, and occasionally figures out why they broke.
url: https://jgalego.github.io
baseurl: ""
logo: /assets/images/avatar.jpg
lang: en_US
social:
  name: João Galego
  links:
    - https://www.github.com/JGalego
    - https://www.linkedin.com/in/jgalego

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/avatar.jpg

markdown: kramdown

footer: true
footer_url: https://jekyllrb.com/
footer_text: © João Galego | Built with ❤️ using Jekyll

sass:
  style: compressed
  sass_dir: _sass

nav:
  - name: Home
    emoji: 🏠
    link: /
  - name: Blog
    emoji: ✍️
    link: /blog
  - name: About
    emoji: ✨
    link: /about
  - name: Projects
    emoji: 🛠️
    link: /projects
  - name: Stuff
    emoji: 💡
    link: /stuff

kramdown:
  # parse markdown inside block-level HTML tag
  parse_block_html: true
  # For more information, please visit:
  # https://gendignoux.com/blog/2020/05/23/katex.html
  math_engine: katex
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    line_numbers: false

plugins:
  - jekyll-katex
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - rouge