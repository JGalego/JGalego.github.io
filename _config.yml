title: João Galego
author: João Galego
description: >-
  João Galego leads AI at Critical Software, previously built ML at Siemens and
  worked with startups at AWS. Writing and projects on AWS, GenAI, agents, and
  building AI that holds up under real-world pressure.
url: https://jgalego.github.io
baseurl: ""
logo: /assets/images/avatar.jpg
lang: en_US
social:
  name: João Galego
  links:
    - https://www.github.com/JGalego
    - https://www.linkedin.com/in/jgalego

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/avatar.jpg

markdown: kramdown

footer: true
footer_url: https://jekyllrb.com/
footer_text: © João Galego | Built with ❤️ using Jekyll

sass:
  style: compressed
  sass_dir: _sass

nav:
  - name: Home 🏠
    link: /
  - name: Blog ✍️
    link: /blog
  - name: About ✨
    link: /about
  - name: Stuff 💡
    link: /stuff

kramdown:
  # parse markdown inside block-level HTML tag
  parse_block_html: true
  # For more information, please visit:
  # https://gendignoux.com/blog/2020/05/23/katex.html
  math_engine: katex
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    line_numbers: false

plugins:
  - jekyll-katex
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - rouge