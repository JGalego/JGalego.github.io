---
# For more information, please visit:
# (old) https://jekyllrb.com/docs/continuous-integration/github-actions/
# (new) https://www.moncefbelyamani.com/making-github-pages-work-with-latest-jekyll/

name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - master  # before October 2020

  # Weekly rebuild to refresh the Projects page (star counts are read from the
  # GitHub API at build time; see _plugins/project_stats.rb)
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '3.2' # Latest 3.2.x; newer runner images only ship the latest patch
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: 🔨 Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          # Used to read star counts for the Projects page (_plugins/project_stats.rb)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔗 Check internal links and images
        # External links are checked weekly by links.yml, so that someone
        # else's outage can't block a deploy
        run: bundle exec htmlproofer ./_site --disable-external --no-enforce-https --ignore-urls "/^\/(navier-stokes|MappingEmbeddings|VectorGarden|GenAI|HyperLab|RunNX)\/$/"
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
